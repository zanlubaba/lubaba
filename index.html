<script>
/* ============ 0. TIỆN ÍCH & TRẠNG THÁI ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='padlettree.v1';
const ICONS=['📁','✈️','🍜','🎨','📷','🏠','🌿','🎵','📚','⭐','💼','🎮'];
let db={folders:[],cards:[],open:{}};
const state={sel:null,q:'',sub:false,layout:'wall',dark:false};
let pending=[],editing=null,lbList=[],lbI=0;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.folders)db=d;const p=JSON.parse(localStorage.getItem(KEY+'.p'));if(p)Object.assign(state,p,{q:''})}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Bộ nhớ trình duyệt đã đầy – hãy xóa bớt ảnh')}}
function savePref(){try{localStorage.setItem(KEY+'.p',JSON.stringify({sel:state.sel,sub:state.sub,layout:state.layout,dark:state.dark}))}catch(e){}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2200)}

const desc=id=>db.folders.filter(f=>f.parent===id).flatMap(f=>[f.id,...desc(f.id)]);
const fname=id=>(db.folders.find(f=>f.id===id)||{}).name||'';
const countIn=id=>{const ids=[id,...desc(id)];return db.cards.filter(c=>ids.includes(c.folder)).length};
function flat(pid=null,d=0){return db.folders.filter(f=>f.parent===pid).flatMap(f=>[{f,d},...flat(f.id,d+1)])}
function path(id){const p=[];let f=db.folders.find(x=>x.id===id);while(f){p.unshift(f);const pr=f.parent;f=db.folders.find(x=>x.id===pr)}return p}

/* ============ 1. HIỂN THỊ ============ */
function render(){renderTree();renderCrumb();renderBoard();syncUI();window.lucide&&lucide.createIcons()}

function treeHTML(pid,d){return db.folders.filter(f=>f.parent===pid).map(f=>{
  const k=db.folders.some(x=>x.parent===f.id),o=db.open[f.id];
  return `<div><div class="row ${state.sel===f.id?'sel':''}" style="padding-left:${8+d*14}px" onclick="selectFolder('${f.id}')">
  <button class="chev ${o?'open':''}" style="width:16px;visibility:${k?'visible':'hidden'}" onclick="event.stopPropagation();toggleOpen('${f.id}')">›</button>
  <span>${esc(f.icon||'📁')}</span><span class="truncate" style="flex:1">${esc(f.name)}</span><span class="cnt">${countIn(f.id)}</span>
  <span class="acts"><button class="ico" title="Tạo thư mục con" onclick="event.stopPropagation();folderModal(null,'${f.id}')">＋</button><button class="ico" title="Sửa" onclick="event.stopPropagation();folderModal('${f.id}')">✎</button><button class="ico" title="Xóa" onclick="event.stopPropagation();delFolder('${f.id}')">🗑</button></span></div>
  ${o&&k?treeHTML(f.id,d+1):''}</div>`}).join('')}
function renderTree(){$('#tree').innerHTML=`<div class="row ${!state.sel?'sel':''}" onclick="selectFolder(null)"><span style="width:16px"></span><span>🏠</span><span style="flex:1">Tất cả thẻ</span><span class="cnt" style="display:block">${db.cards.length}</span></div>`+treeHTML(null,0)}
function renderCrumb(){$('#crumb').innerHTML=`<button class="btn" style="padding:4px 10px" onclick="selectFolder(null)">🏠 Tất cả</button>`+path(state.sel).map(x=>`<span style="color:var(--tx2)">/</span><button class="btn" style="padding:4px 10px" onclick="selectFolder('${x.id}')">${esc(x.icon||'📁')} ${esc(x.name)}</button>`).join('')}

function vis(){
  let ids=null;if(state.sel)ids=state.sub?[state.sel,...desc(state.sel)]:[state.sel];
  const q=nz(state.q.trim());
  return db.cards.filter(c=>(!ids||ids.includes(c.folder))&&(!q||nz(c.title+' '+c.note+' '+c.name).includes(q))).sort((a,b)=>b.t-a.t)}
function renderBoard(){
  const b=$('#board'),list=vis();b.className=state.layout;
  const qp=state.sel?`<div class="qp" onclick="$('#fileIn').click()"><div style="font-size:24px">＋</div>Thêm ảnh vào thư mục này</div>`:'';
  b.innerHTML=qp+list.map((c,i)=>`<article class="card" tabindex="0" onclick="openLb(${i})" onkeydown="if(event.key==='Enter')openLb(${i})">
  ${c.img?`<img src="${c.img}" alt="${esc(c.title)}" loading="lazy">`:''}
  <div class="bar"><button class="ico" title="Sửa" onclick="event.stopPropagation();postModal('${c.id}')">✎</button><button class="ico" title="Xóa" onclick="event.stopPropagation();delCard('${c.id}')">🗑</button></div>
  <div class="p-3"><div class="hd font-bold">${esc(c.title)}</div>${c.note?`<div class="clamp mt-1" style="color:var(--tx2)">${esc(c.note)}</div>`:''}
  <div class="mt-2"><span class="chip">📁 ${esc(fname(c.folder))}</span></div></div></article>`).join('');
  const e=$('#empty');e.classList.toggle('hidden',!!list.length);
  e.innerHTML=state.q?'Không tìm thấy thẻ phù hợp.':'Chưa có thẻ nào. Bấm “Đăng thẻ mới” hoặc kéo ảnh vào đây.'}
function syncUI(){
  $('#subChk').checked=state.sub;$('#addSub').style.display=state.sel?'':'none';
  document.querySelectorAll('[data-lay]').forEach(b=>b.style.background=b.dataset.lay===state.layout?'var(--hov)':'');
  $('#themeBtn').innerHTML=`<i data-lucide="${state.dark?'sun':'moon'}"></i>`}

/* ============ 2. ĐIỀU HƯỚNG ============ */
function toggleSide(o){$('#side').classList.toggle('open',o);$('#scrim').classList.toggle('hidden',!o)}
function toggleTheme(){state.dark=!state.dark;document.documentElement.classList.toggle('dark',state.dark);savePref();render()}
function setLayout(l){state.layout=l;savePref();render()}
function toggleOpen(id){db.open[id]=!db.open[id];save();render()}
function selectFolder(id){state.sel=id;if(id)db.open[id]=true;savePref();save();toggleSide(false);render()}

/* ============ 3. MODAL CHUNG ============ */
function openModal(h){const m=$('#modal');m.innerHTML=h;m.classList.add('show')}
function closeModal(){$('#modal').classList.remove('show');$('#modal').innerHTML='';pending=[];editing=null}

/* ============ 4. THƯ MỤC ============ */
function folderModal(id,parent){
  const f=id&&db.folders.find(x=>x.id===id),ic=f?f.icon:'📁';
  openModal(`<div class="dlg"><h2 class="hd text-lg font-bold">${f?'Sửa thư mục':parent?'Tạo thư mục con':'Tạo thư mục gốc'}</h2>
  ${parent&&!f?`<div class="chip mt-2">trong: ${esc(fname(parent))}</div>`:''}
  <label class="lb">Tên thư mục</label><input id="fn" value="${esc(f?f.name:'')}" onkeydown="if(event.key==='Enter')saveFolder('${id||''}','${parent||''}')">
  <label class="lb">Biểu tượng</label><div class="flex flex-wrap gap-2" id="fic">${ICONS.map(e=>`<button class="ic ${e===ic?'on':''}" onclick="document.querySelectorAll('#fic .ic').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${e}</button>`).join('')}</div>
  <div class="flex justify-end gap-2 mt-4"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="saveFolder('${id||''}','${parent||''}')">Lưu</button></div></div>`);
  setTimeout(()=>$('#fn')&&$('#fn').focus(),30)}
function saveFolder(id,parent){
  const name=$('#fn').value.trim();if(!name){toast('Hãy nhập tên thư mục');return}
  const ic=($('#fic .on')||{}).textContent||'📁';
  if(id){const f=db.folders.find(x=>x.id===id);f.name=name;f.icon=ic}
  else{const n={id:uid(),name,icon:ic,parent:parent||null};db.folders.push(n);if(parent)db.open[parent]=true;state.sel=n.id}
  save();savePref();closeModal();render();toast('Đã lưu thư mục')}
function delFolder(id){
  const ids=[id,...desc(id)],n=db.cards.filter(c=>ids.includes(c.folder)).length;
  if(!confirm(`Xóa thư mục này${ids.length>1?` và ${ids.length-1} thư mục con`:''}${n?`, cùng ${n} thẻ bên trong`:''}?`))return;
  const par=(db.folders.find(f=>f.id===id)||{}).parent||null;
  db.folders=db.folders.filter(f=>!ids.includes(f.id));db.cards=db.cards.filter(c=>!ids.includes(c.folder));
  if(ids.includes(state.sel))state.sel=par;save();savePref();render();toast('Đã xóa thư mục')}

/* ============ 5. THẺ ẢNH ============ */
function readImg(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();
  im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({img:c.toDataURL('image/jpeg',.8),name:file.name})};
  im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
async function addFiles(files){
  const fs=[...files].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;
  const r=(await Promise.all(fs.map(readImg))).filter(Boolean);
  if($('#modal').classList.contains('show')&&$('#pth')){if(editing)pending=[];pending.push(...r);if(editing)pending=pending.slice(0,1);drawThumbs()}
  else{pending=r;postModal(null,true)}}
function drawThumbs(){
  const c=editing&&db.cards.find(x=>x.id===editing),l=pending.length?pending:(c&&c.img?[c]:[]);
  $('#pth').innerHTML=l.map(p=>`<img src="${p.img}" alt="">`).join('')}
function postModal(id,keep){
  if(!db.folders.length){toast('Hãy tạo một thư mục trước');folderModal(null,null);return}
  if(!keep)pending=[];editing=id||null;
  const c=id&&db.cards.find(x=>x.id===id),fv=c?c.folder:(state.sel||db.folders[0].id);
  openModal(`<div class="dlg"><h2 class="hd text-lg font-bold">${c?'Sửa thẻ':'Đăng thẻ mới'}</h2>
  <label class="lb">Tiêu đề</label><input id="pt" value="${esc(c?c.title:'')}">
  <label class="lb">Ghi chú</label><textarea id="pn" rows="3">${esc(c?c.note:'')}</textarea>
  <label class="lb">Thư mục</label><select id="pf">${flat().map(({f,d})=>`<option value="${f.id}" ${f.id===fv?'selected':''}>${'\u00A0'.repeat(d*3)}${d?'└ ':''}${esc(f.name)}</option>`).join('')}</select>
  <label class="lb">Ảnh ${c?'(chọn để thay ảnh)':'(có thể chọn nhiều)'}</label><button class="btn" onclick="$('#fileIn').click()">🖼 Chọn ảnh</button><div class="thumbs" id="pth"></div>
  <div class="flex justify-end gap-2 mt-4"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="savePost('${id||''}')">Lưu</button></div></div>`);
  drawThumbs();setTimeout(()=>$('#pt')&&$('#pt').focus(),30)}
function savePost(id){
  const t=$('#pt').value.trim(),n=$('#pn').value.trim(),f=$('#pf').value,now=Date.now();
  if(id){const c=db.cards.find(x=>x.id===id);Object.assign(c,{title:t||c.title,note:n,folder:f});if(pending[0]){c.img=pending[0].img;c.name=pending[0].name}}
  else{
    if(!t&&!pending.length){toast('Nhập tiêu đề hoặc chọn ảnh');return}
    if(!pending.length)db.cards.push({id:uid(),folder:f,title:t,note:n,img:'',name:'',t:now});
    pending.forEach((p,i)=>db.cards.push({id:uid(),folder:f,title:t?(pending.length>1?`${t} ${i+1}`:t):p.name.replace(/\.\w+$/,''),note:n,img:p.img,name:p.name,t:now+i}))}
  save();closeModal();render();toast('Đã lưu thẻ')}
function delCard(id){
  if(!confirm('Xóa thẻ này?'))return;
  db.cards=db.cards.filter(c=>c.id!==id);save();closeLb();render();toast('Đã xóa thẻ')}

/* ============ 6. LIGHTBOX ============ */
function openLb(i){lbList=vis();lbI=i;drawLb()}
function drawLb(){
  const c=lbList[lbI];if(!c)return closeLb();
  $('#lb').classList.add('show');
  $('#lb').innerHTML=`<div class="lbx"><div class="pic">${c.img?`<img src="${c.img}" alt="${esc(c.title)}">`:'<div class="p-8" style="color:#fff">Thẻ không có ảnh</div>'}</div>
  <div class="p-5 flex flex-col gap-2"><h2 class="hd text-xl font-bold">${esc(c.title)}</h2>
  ${c.note?`<div style="white-space:pre-wrap;color:var(--tx2)">${esc(c.note)}</div>`:''}
  <div><span class="chip">📁 ${esc(path(c.folder).map(x=>x.name).join(' / '))}</span></div>
  <div><span class="chip">🕒 ${new Date(c.t).toLocaleString('vi-VN')}</span></div>
  <div class="flex gap-2 mt-auto pt-3 flex-wrap"><button class="btn" onclick="closeLb();postModal('${c.id}')">✎ Sửa</button><button class="btn bad" onclick="delCard('${c.id}')">🗑 Xóa</button><button class="btn" onclick="closeLb()">Đóng</button></div></div></div>
  <button class="nav" style="left:12px" aria-label="Trước" onclick="lbGo(-1)">‹</button><button class="nav" style="right:12px" aria-label="Sau" onclick="lbGo(1)">›</button>`}
function lbGo(d){if(!lbList.length)return;lbI=(lbI+d+lbList.length)%lbList.length;drawLb()}
function closeLb(){$('#lb').classList.remove('show');$('#lb').innerHTML=''}

/* ============ 7. DỮ LIỆU MẪU ============ */
function svg(w,h,a,b,t){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="50%" fill="#fff" font-size="${Math.round(w/11)}" font-family="sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="middle">${t}</text></svg>`)}
function clearSample(q){
  const ids=new Set(db.folders.filter(f=>f.s).flatMap(f=>[f.id,...desc(f.id)]));
  db.folders=db.folders.filter(f=>!ids.has(f.id));db.cards=db.cards.filter(c=>!c.s&&!ids.has(c.folder));
  if(state.sel&&ids.has(state.sel))state.sel=null;
  if(q===true)return;save();savePref();render();toast('Đã xóa dữ liệu mẫu')}
function seedSample(){
  clearSample(true);
  const F=(n,i,p)=>{const f={id:uid(),name:n,icon:i,parent:p,s:1};db.folders.push(f);return f.id};
  const vn=F('Du lịch','✈️',null),dl=F('Đà Lạt','🌲',vn),ha=F('Hội An','🏮',vn),an=F('Ẩm thực','🍜',null),de=F('Thiết kế','🎨',null);
  const C=(f,t,n,w,h,a,b)=>db.cards.push({id:uid(),folder:f,title:t,note:n,img:svg(w,h,a,b,t),name:t+'.svg',t:Date.now()-db.cards.length*1000,s:1});
  C(dl,'Đồi chè Cầu Đất','Bình minh trên đồi chè, sương còn phủ mỏng.',600,800,'#10B981','#065F46');
  C(dl,'Hồ Xuân Hương','Đạp xe quanh hồ buổi chiều.',800,600,'#6366F1','#312E81');
  C(ha,'Phố đèn lồng','Đêm Hội An lung linh.',600,900,'#F59E0B','#B45309');
  C(ha,'Chùa Cầu','Biểu tượng của phố cổ.',800,560,'#EF4444','#7F1D1D');
  C(an,'Bún bò Huế','Nước dùng đậm đà, thêm chút mắm ruốc.',700,700,'#F97316','#9A3412');
  C(an,'Cà phê muối','Ngọt, mặn, béo – uống một lần là nghiện.',600,760,'#92400E','#451A03');
  C(de,'Bảng màu Indigo','Palette cho dự án mới.',800,500,'#818CF8','#4338CA');
  C(de,'Mockup ứng dụng','Ý tưởng giao diện bản đầu.',640,860,'#EC4899','#831843');
  db.open[vn]=true;save();render();toast('Đã khôi phục dữ liệu mẫu')}

/* ============ 8. KHỞI TẠO ============ */
let dc=0;
addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dc++;$('#ov').style.display='grid'}});
addEventListener('dragleave',()=>{if(--dc<=0){dc=0;$('#ov').style.display='none'}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('#ov').style.display='none';if(e.dataTransfer)addFiles(e.dataTransfer.files)});
addEventListener('paste',e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.clipboardData)addFiles(e.clipboardData.files)});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeLb()}
  if($('#lb').classList.contains('show')){if(e.key==='ArrowLeft')lbGo(-1);if(e.key==='ArrowRight')lbGo(1)}});
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#lb').onclick=e=>{if(e.target.id==='lb')closeLb()};
$('#fileIn').onchange=function(){addFiles(this.files);this.value=''};

load();
document.documentElement.classList.toggle('dark',state.dark);
if(!db.folders.length&&!localStorage.getItem(KEY))seedSample();
else render();
</script>
</body>
</html>
